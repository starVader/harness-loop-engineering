<svg xmlns="http://www.w3.org/2000/svg" width="900" height="858" viewBox="0 0 900 858" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Stage 8: the outer loop, learning from past runs</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="900" height="858" fill="#FFFFFF"/>
<text x="30" y="40" font-size="21" font-weight="600" fill="#2C2C2A">Stage 8: the outer loop, learning from past runs</text>
<text x="30" y="64" font-size="13.5" fill="#5F5E5A">The inner loop fixes code. The outer loop fixes the harness, and only through a human.</text>
<rect x="600" y="54" width="16" height="12" rx="3" fill="#FAECE7" stroke="#D85A30"/><text x="622" y="64" font-size="12" fill="#5F5E5A">new in this stage</text>
<rect x="280.0" y="82.0" width="340" height="56" rx="28.0" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="450" y="105.5" font-size="13.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">before: held-out bug sets 04-06</text><text x="450" y="123.5" font-size="12.5" font-weight="400" fill="#2C2C2A" text-anchor="middle">committed INTENT.md, no lessons</text><rect x="290.0" y="166.0" width="320" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/><text x="450" y="189.5" font-size="13.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">train: bug sets 01-03</text><text x="450" y="207.5" font-size="12.5" font-weight="400" fill="#2C2C2A" text-anchor="middle">the audit reports incidents</text><rect x="270.0" y="250.0" width="360" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/><text x="450" y="273.5" font-size="13.5" font-weight="600" fill="#712B13" text-anchor="middle">reflect.py propose (Opus)</text><text x="450" y="291.5" font-size="12.5" font-weight="400" fill="#712B13" text-anchor="middle">reads train-* only → rules + lessons</text><polygon points="450,330.0 590.0,362 450,394.0 310.0,362" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/><text x="450" y="357.5" font-size="13.5" font-weight="600" fill="#712B13" text-anchor="middle">Human gate:</text><text x="450" y="375.5" font-size="12.5" font-weight="400" fill="#712B13" text-anchor="middle">accept with a sentence?</text><rect x="50.0" y="334.0" width="200" height="56" rx="28.0" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.2"/><text x="150" y="357.5" font-size="13.5" font-weight="600" fill="#791F1F" text-anchor="middle">reject: &lt;why&gt;</text><text x="150" y="375.5" font-size="12.5" font-weight="400" fill="#791F1F" text-anchor="middle">→ never applied</text><rect x="290.0" y="418.0" width="320" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/><text x="450" y="441.5" font-size="13.5" font-weight="600" fill="#712B13" text-anchor="middle">runs/stage8/learned/</text><text x="450" y="459.5" font-size="12.5" font-weight="400" fill="#712B13" text-anchor="middle">INTENT.md + LESSONS.md</text><rect x="280.0" y="502.0" width="340" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/><text x="450" y="525.5" font-size="13.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">after: held-out 04-06 again</text><text x="450" y="543.5" font-size="12.5" font-weight="400" fill="#2C2C2A" text-anchor="middle">retrain: 01-03 again (overfitting)</text><rect x="290.0" y="592.0" width="320" height="44" rx="22.0" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/><text x="450" y="618.5" font-size="13.5" font-weight="600" fill="#27500A" text-anchor="middle">summary: incidents before → after</text><path d="M450,138.0 L450,166.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><path d="M450,222.0 L450,250.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><path d="M450,306.0 L450,330.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><path d="M310.0,362 L250.0,362" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="302.0" y="354" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="end">reject</text><path d="M450,394.0 L450,418.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="458.0" y="402.0" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="start">accept</text><path d="M450,474.0 L450,502.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><path d="M450,558.0 L450,592.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="30" y="718" width="840" height="100" rx="10" fill="#F1EFE8" stroke="#B4B2A9"/><text x="48" y="742" font-size="13" fill="#2C2C2A" font-weight="600">Design: learn on 01-03, measure on unseen 04-06. The audit (scenarios/audit/) stands in for production.</text><text x="48" y="762" font-size="13" fill="#2C2C2A" font-weight="400">Every bug set fails one visible test and has a shortcut the audit catches (checked in selftest/).</text><text x="48" y="782" font-size="13" fill="#2C2C2A" font-weight="400">Held-out incidents fall → the lesson transfers. Only train incidents fall → memorisation.</text><text x="48" y="802" font-size="13" fill="#2C2C2A" font-weight="400">The reflector never sees held-out runs or the audit&#x27;s tests, and can&#x27;t edit tests, tools or the goal.</text>
</svg>