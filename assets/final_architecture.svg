<svg xmlns="http://www.w3.org/2000/svg" width="960" height="750" viewBox="0 0 960 750" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Architecture: the harness, all 8 layers</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="960" height="750" fill="#FFFFFF"/>
  <text x="30" y="40" font-size="22" font-weight="600" fill="#2C2C2A">Architecture: the harness, all 8 layers</text>
  <text x="30" y="63" font-size="14" fill="#5F5E5A">Every piece built. The loop drives the model; the harness decides what it may touch and when it is done.</text>

  <rect x="30" y="82" width="270" height="62" rx="10" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="165" y="107" font-size="15" font-weight="600" fill="#2C2C2A" text-anchor="middle">Outer loop · stage 8</text>
  <text x="165" y="129" font-size="12.5" fill="#5F5E5A" text-anchor="middle">reflect.py: past runs → rules + lessons</text>
  <rect x="345" y="82" width="270" height="62" rx="10" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="480" y="107" font-size="15" font-weight="600" fill="#2C2C2A" text-anchor="middle">Claude API</text>
  <text x="480" y="129" font-size="12.5" fill="#5F5E5A" text-anchor="middle">actor · checker · reflector</text>
  <rect x="660" y="82" width="270" height="62" rx="10" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="795" y="107" font-size="15" font-weight="600" fill="#2C2C2A" text-anchor="middle">You (the human)</text>
  <text x="795" y="129" font-size="12.5" fill="#5F5E5A" text-anchor="middle">write intent · explain each block · gate lessons</text>

  <rect x="30" y="170" width="900" height="450" rx="16" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="910" y="195" font-size="16" font-weight="600" fill="#3C3489" text-anchor="end">Harness <tspan font-size="13" font-weight="400" fill="#534AB7">· everything around the model</tspan></text>

  <rect x="50" y="210" width="860" height="176" rx="12" fill="#FAECE7" stroke="#993C1D"/>
  <text x="480" y="234" font-size="15" font-weight="600" fill="#712B13" text-anchor="middle">Loop · harness/loop.py (stages 1–4)</text>
  <g>
    <rect x="70" y="250" width="190" height="80" rx="8" fill="#FFFFFF" stroke="#D85A30"/>
    <text x="165" y="276" font-size="14.5" font-weight="600" fill="#712B13" text-anchor="middle">Goal · goal.py</text>
    <text x="165" y="298" font-size="12.5" fill="#993C1D" text-anchor="middle">PytestGoal: exit code 0</text>
    <text x="165" y="317" font-size="12" fill="#993C1D" text-anchor="middle">stage 2</text>
    <rect x="280" y="250" width="190" height="80" rx="8" fill="#FFFFFF" stroke="#D85A30"/>
    <text x="375" y="276" font-size="14.5" font-weight="600" fill="#712B13" text-anchor="middle">Act</text>
    <text x="375" y="298" font-size="12.5" fill="#993C1D" text-anchor="middle">model replies with tool_use</text>
    <text x="375" y="317" font-size="12" fill="#993C1D" text-anchor="middle">stage 1</text>
    <rect x="490" y="250" width="190" height="80" rx="8" fill="#FFFFFF" stroke="#D85A30"/>
    <text x="585" y="276" font-size="14.5" font-weight="600" fill="#712B13" text-anchor="middle">Observe</text>
    <text x="585" y="298" font-size="12.5" fill="#993C1D" text-anchor="middle">execute_tool → tool_result</text>
    <text x="585" y="317" font-size="12" fill="#993C1D" text-anchor="middle">stage 1</text>
    <rect x="700" y="250" width="190" height="80" rx="8" fill="#FFFFFF" stroke="#D85A30"/>
    <text x="795" y="276" font-size="14.5" font-weight="600" fill="#712B13" text-anchor="middle">Adjust</text>
    <text x="795" y="298" font-size="12.5" fill="#993C1D" text-anchor="middle">next call; compact past 5K</text>
    <text x="795" y="317" font-size="12" fill="#993C1D" text-anchor="middle">stage 4</text>
  </g>
  <line x1="262" y1="290" x2="276" y2="290" stroke="#993C1D" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="472" y1="290" x2="486" y2="290" stroke="#993C1D" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="682" y1="290" x2="696" y2="290" stroke="#993C1D" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="480" y="365" font-size="13" fill="#993C1D" text-anchor="middle">↻ repeat until the goal is met or 8 passes</text>

  <line x1="165" y1="146" x2="165" y2="207" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="175" y="166" font-size="12" fill="#5F5E5A">learned intent + lessons</text>
  <line x1="480" y1="146" x2="480" y2="207" stroke="#5F5E5A" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="490" y="166" font-size="12" fill="#5F5E5A">messages.create</text>

  <rect x="70" y="418" width="230" height="70" rx="8" fill="#FFFFFF" stroke="#7F77DD"/>
  <text x="185" y="443" font-size="14.5" font-weight="600" fill="#3C3489" text-anchor="middle">spine.py · stage 3</text>
  <text x="185" y="465" font-size="12.5" fill="#534AB7" text-anchor="middle">progress.json · trace.jsonl</text>
  <line x1="185" y1="416" x2="185" y2="390" stroke="#534AB7" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>

  <line x1="455" y1="388" x2="455" y2="415" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="463" y="405" font-size="12" fill="#3B6D11">goal met</text>
  <line x1="405" y1="416" x2="405" y2="390" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="397" y="405" font-size="12" fill="#A32D2D" text-anchor="end">fail → violations fed back</text>

  <rect x="330" y="418" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#7F77DD"/>
  <text x="430" y="443" font-size="14.5" font-weight="600" fill="#3C3489" text-anchor="middle">sensors + checker · stage 5</text>
  <text x="430" y="465" font-size="12.5" fill="#534AB7" text-anchor="middle">fixed rules, then Haiku</text>
  <line x1="532" y1="453" x2="556" y2="453" stroke="#534AB7" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="560" y="418" width="180" height="70" rx="8" fill="#FFFFFF" stroke="#7F77DD"/>
  <text x="650" y="443" font-size="14.5" font-weight="600" fill="#3C3489" text-anchor="middle">gate.py · stage 7</text>
  <text x="650" y="465" font-size="12.5" fill="#534AB7" text-anchor="middle">one sentence per block</text>
  <line x1="742" y1="453" x2="766" y2="453" stroke="#534AB7" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="770" y="418" width="140" height="70" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
  <text x="840" y="443" font-size="14.5" font-weight="600" fill="#27500A" text-anchor="middle">Accepted</text>
  <text x="840" y="465" font-size="12.5" fill="#3B6D11" text-anchor="middle">fix is kept</text>

  <rect x="70" y="512" width="260" height="70" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text x="200" y="537" font-size="14.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">tools.py · stage 0</text>
  <text x="200" y="559" font-size="12.5" fill="#5F5E5A" text-anchor="middle">4 tools · sandbox.py runs the code</text>
  <rect x="350" y="512" width="260" height="70" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text x="480" y="537" font-size="14.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">tests/ · the oracle</text>
  <text x="480" y="559" font-size="12.5" fill="#5F5E5A" text-anchor="middle">14 tests · read-only · decides "done"</text>
  <rect x="630" y="512" width="280" height="70" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text x="770" y="537" font-size="14.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">INTENT.md · the why</text>
  <text x="770" y="559" font-size="12.5" fill="#5F5E5A" text-anchor="middle">actor and checker read it · stage 6</text>
  <text x="350" y="604" font-size="12" fill="#5F5E5A">Foundations (bottom row) · one layer per stage (above) · all in harness/</text>

  <line x1="200" y1="584" x2="200" y2="644" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="210" y="634" font-size="12" fill="#0F6E56">write_file</text>
  <rect x="70" y="648" width="260" height="62" rx="10" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="200" y="673" font-size="15" font-weight="600" fill="#085041" text-anchor="middle">checkout/</text>
  <text x="200" y="695" font-size="12.5" fill="#0F6E56" text-anchor="middle">the code being repaired</text>

  <line x1="770" y1="622" x2="770" y2="644" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <rect x="630" y="648" width="280" height="62" rx="10" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="770" y="673" font-size="15" font-weight="600" fill="#2C2C2A" text-anchor="middle">results/stageN/</text>
  <text x="770" y="695" font-size="12.5" fill="#5F5E5A" text-anchor="middle">recorded runs, committed</text>
  <text x="30" y="736" font-size="12" fill="#888780">Budgets escalate to a human · every run traced · start from:  python -m harness.scenario apply broken</text>
</svg>
