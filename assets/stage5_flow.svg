<svg xmlns="http://www.w3.org/2000/svg" width="900" height="814" viewBox="0 0 900 814" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Stage 5: the checker, a second model reviews the work</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="900" height="814" fill="#FFFFFF"/>
<text x="30" y="40" font-size="21" font-weight="600" fill="#2C2C2A">Stage 5: the checker, a second model reviews the work</text>
<text x="30" y="64" font-size="13.5" fill="#5F5E5A">Tests decide whether the code works; the checker decides whether the change is allowed.</text>
<rect x="600" y="54" width="16" height="12" rx="3" fill="#FAECE7" stroke="#D85A30"/><text x="622" y="64" font-size="12" fill="#5F5E5A">new in this stage</text>
<rect x="285.0" y="82.0" width="330" height="56" rx="28.0" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="450" y="105.5" font-size="13.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">A loop pass ran its tools</text><text x="450" y="123.5" font-size="12.5" font-weight="400" fill="#2C2C2A" text-anchor="middle">and goal.is_met() is True</text><polygon points="450,162.0 615.0,194 450,226.0 285.0,194" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/><text x="450" y="189.5" font-size="13.5" font-weight="600" fill="#712B13" text-anchor="middle">Fixed rules (code, free):</text><text x="450" y="207.5" font-size="12.5" font-weight="400" fill="#712B13" text-anchor="middle">CATALOG and checks kept?</text><rect x="45.0" y="166.0" width="210" height="56" rx="28.0" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.2"/><text x="150" y="189.5" font-size="13.5" font-weight="600" fill="#791F1F" text-anchor="middle">FAIL → back to the actor</text><text x="150" y="207.5" font-size="12.5" font-weight="400" fill="#791F1F" text-anchor="middle">no model call spent</text><rect x="270.0" y="250.0" width="360" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/><text x="450" y="273.5" font-size="13.5" font-weight="600" fill="#712B13" text-anchor="middle">Collect the evidence: the change since</text><text x="450" y="291.5" font-size="12.5" font-weight="400" fill="#712B13" text-anchor="middle">the scenario was applied  +  INTENT.md</text><polygon points="450,330.0 590.0,362 450,394.0 310.0,362" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/><text x="450" y="357.5" font-size="13.5" font-weight="600" fill="#712B13" text-anchor="middle">Checker (Haiku):</text><text x="450" y="375.5" font-size="12.5" font-weight="400" fill="#712B13" text-anchor="middle">allowed by INTENT.md?</text><rect x="640.0" y="334.0" width="220" height="56" rx="28.0" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/><text x="750" y="357.5" font-size="13.5" font-weight="600" fill="#27500A" text-anchor="middle">PASS → DONE</text><text x="750" y="375.5" font-size="12.5" font-weight="400" fill="#27500A" text-anchor="middle">change accepted</text><rect x="50.0" y="325.0" width="200" height="74" rx="37.0" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.2"/><text x="150" y="348.5" font-size="13.5" font-weight="600" fill="#791F1F" text-anchor="middle">Checker unavailable</text><text x="150" y="366.5" font-size="12.5" font-weight="400" fill="#791F1F" text-anchor="middle">→ NOT accepted</text><text x="150" y="384.5" font-size="12.5" font-weight="400" fill="#791F1F" text-anchor="middle">(fail closed)</text><rect x="270.0" y="418.0" width="360" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/><text x="450" y="441.5" font-size="13.5" font-weight="600" fill="#712B13" text-anchor="middle">FAIL → violations back to the actor</text><text x="450" y="459.5" font-size="12.5" font-weight="400" fill="#712B13" text-anchor="middle">each quotes the rule it breaks</text><rect x="280.0" y="502.0" width="340" height="56" rx="28.0" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/><text x="450" y="525.5" font-size="13.5" font-weight="600" fill="#3C3489" text-anchor="middle">Next pass: the actor fixes again</text><text x="450" y="543.5" font-size="12.5" font-weight="400" fill="#3C3489" text-anchor="middle">↻ goal check → rules → checker again</text><path d="M450,138.0 L450,162.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><path d="M285.0,194 L255.0,194" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="277.0" y="186" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="end">fail</text><path d="M450,226.0 L450,250.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="458.0" y="234.0" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="start">pass</text><path d="M450,306.0 L450,330.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><path d="M590.0,362 L640.0,362" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="598.0" y="354" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="start">pass</text><path d="M310.0,362 L250.0,362" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="302.0" y="354" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="end">error</text><path d="M450,394.0 L450,418.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="458.0" y="402.0" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="start">fail</text><path d="M450,474.0 L450,502.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="30" y="634" width="840" height="140" rx="10" fill="#F1EFE8" stroke="#B4B2A9"/><text x="48" y="658" font-size="13" fill="#2C2C2A" font-weight="600">Result: 3 diffs that all pass the 14 tests (1 honest fix, 2 cheats) × 2 rulebooks.</text><text x="48" y="678" font-size="13" fill="#2C2C2A" font-weight="400">Empty INTENT.md: all 3 PASS, cheats included (noticed, but no written rule to fail them on).</text><text x="48" y="698" font-size="13" fill="#2C2C2A" font-weight="400">Rules v1: both cheats FAIL, but the honest fix FAILS too: &quot;never relax validation&quot; was too vague.</text><text x="48" y="718" font-size="13" fill="#2C2C2A" font-weight="400">Rules v2 (+ &quot;min spend is inclusive&quot;): honest PASS, both cheats FAIL; one review misread a line.</text><text x="48" y="738" font-size="13" fill="#2C2C2A" font-weight="400">Lesson: a checker only enforces written intent, as precisely as it&#x27;s written, and is still just an agent.</text><text x="48" y="758" font-size="13" fill="#2C2C2A" font-weight="400">Since then: fixed rules catch both cheats for free first; checker_eval.py tests the checker itself (pass^k).</text>
</svg>