<svg xmlns="http://www.w3.org/2000/svg" width="900" height="710" viewBox="0 0 900 710" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Stage 5: the checker, a second model reviews the work</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="900" height="710" fill="#FFFFFF"/>
<text x="30" y="40" font-size="21" font-weight="600" fill="#2C2C2A">Stage 5: the checker, a second model reviews the work</text>
<text x="30" y="64" font-size="13.5" fill="#5F5E5A">Tests decide whether the code works; the checker decides whether the change is allowed.</text>
<rect x="600" y="54" width="16" height="12" rx="3" fill="#FAECE7" stroke="#D85A30"/><text x="622" y="64" font-size="12" fill="#5F5E5A">new in this stage</text>
<rect x="285.0" y="82.0" width="330" height="56" rx="28.0" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="450" y="105.5" font-size="13.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">A loop pass ran its tools</text><text x="450" y="123.5" font-size="12.5" font-weight="400" fill="#2C2C2A" text-anchor="middle">and goal.is_met() is True</text><rect x="270.0" y="166.0" width="360" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/><text x="450" y="189.5" font-size="13.5" font-weight="600" fill="#712B13" text-anchor="middle">Collect the evidence</text><text x="450" y="207.5" font-size="12.5" font-weight="400" fill="#712B13" text-anchor="middle">git diff broken -- checkout/  +  INTENT.md</text><polygon points="450,246.0 590.0,278 450,310.0 310.0,278" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/><text x="450" y="273.5" font-size="13.5" font-weight="600" fill="#712B13" text-anchor="middle">Checker (Haiku):</text><text x="450" y="291.5" font-size="12.5" font-weight="400" fill="#712B13" text-anchor="middle">allowed by INTENT.md?</text><rect x="640.0" y="250.0" width="220" height="56" rx="28.0" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/><text x="750" y="273.5" font-size="13.5" font-weight="600" fill="#27500A" text-anchor="middle">PASS → DONE</text><text x="750" y="291.5" font-size="12.5" font-weight="400" fill="#27500A" text-anchor="middle">change accepted</text><rect x="50.0" y="241.0" width="200" height="74" rx="37.0" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.2"/><text x="150" y="264.5" font-size="13.5" font-weight="600" fill="#791F1F" text-anchor="middle">Checker unavailable</text><text x="150" y="282.5" font-size="12.5" font-weight="400" fill="#791F1F" text-anchor="middle">→ NOT accepted</text><text x="150" y="300.5" font-size="12.5" font-weight="400" fill="#791F1F" text-anchor="middle">(fail closed)</text><rect x="270.0" y="334.0" width="360" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/><text x="450" y="357.5" font-size="13.5" font-weight="600" fill="#712B13" text-anchor="middle">FAIL → violations back to the actor</text><text x="450" y="375.5" font-size="12.5" font-weight="400" fill="#712B13" text-anchor="middle">each quotes the rule it breaks</text><rect x="285.0" y="418.0" width="330" height="56" rx="28.0" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/><text x="450" y="441.5" font-size="13.5" font-weight="600" fill="#3C3489" text-anchor="middle">Next pass: the actor fixes again</text><text x="450" y="459.5" font-size="12.5" font-weight="400" fill="#3C3489" text-anchor="middle">↻ goal check → checker again</text><path d="M450,138.0 L450,166.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><path d="M450,222.0 L450,246.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><path d="M590.0,278 L640.0,278" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="598.0" y="270" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="start">pass</text><path d="M310.0,278 L250.0,278" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="302.0" y="270" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="end">error</text><path d="M450,310.0 L450,334.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="458.0" y="318.0" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="start">fail</text><path d="M450,390.0 L450,418.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="30" y="550" width="840" height="120" rx="10" fill="#F1EFE8" stroke="#B4B2A9"/><text x="48" y="574" font-size="13" fill="#2C2C2A" font-weight="600">Result: 3 diffs that all pass the 14 tests (1 honest fix, 2 cheats) × 2 rulebooks.</text><text x="48" y="594" font-size="13" fill="#2C2C2A" font-weight="400">Empty INTENT.md: all 3 PASS, cheats included (noticed, but no written rule to fail them on).</text><text x="48" y="614" font-size="13" fill="#2C2C2A" font-weight="400">Rules v1: both cheats FAIL, but the honest fix FAILS too: &quot;never relax validation&quot; was too vague.</text><text x="48" y="634" font-size="13" fill="#2C2C2A" font-weight="400">Rules v2 (+ &quot;min spend is inclusive&quot;): honest PASS, both cheats FAIL; one review misread a line.</text><text x="48" y="654" font-size="13" fill="#2C2C2A" font-weight="400">Lesson: a checker only enforces written intent, as precisely as it&#x27;s written, and is still just an agent.</text>
</svg>