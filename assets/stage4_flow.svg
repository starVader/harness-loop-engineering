<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1214" viewBox="0 0 900 1214" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Stage 4: compaction, forgetting on purpose</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="900" height="1214" fill="#FFFFFF"/>
<text x="30" y="40" font-size="21" font-weight="600" fill="#2C2C2A">Stage 4: compaction, forgetting on purpose</text>
<text x="30" y="64" font-size="13.5" fill="#5F5E5A">When the last call was too big, restart the conversation from the spine&#x27;s briefing.</text>
<rect x="600" y="54" width="16" height="12" rx="3" fill="#FAECE7" stroke="#D85A30"/><text x="622" y="64" font-size="12" fill="#5F5E5A">new in this stage</text>
<rect x="300.0" y="88.0" width="300" height="44" rx="22.0" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="450" y="114.5" font-size="13.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">Start: --fresh? --stop-after N?</text><rect x="280.0" y="166.0" width="340" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/><text x="450" y="189.5" font-size="13.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">open_spine(): read progress.json</text><text x="450" y="207.5" font-size="12.5" font-weight="400" fill="#2C2C2A" text-anchor="middle">stale fingerprint → fresh · running → resume</text><rect x="325.0" y="250.0" width="250" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/><text x="450" y="273.5" font-size="13.5" font-weight="600" fill="#3C3489" text-anchor="middle">Act: call the model</text><text x="450" y="291.5" font-size="12.5" font-weight="400" fill="#3C3489" text-anchor="middle">(on resume: task + briefing)</text><polygon points="450,330.0 575.0,362 450,394.0 325.0,362" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/><text x="450" y="366.5" font-size="13.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">stop_reason == tool_use?</text><rect x="325.0" y="424.0" width="250" height="44" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/><text x="450" y="450.5" font-size="13.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">Observe: run every tool</text><rect x="300.0" y="502.0" width="300" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/><text x="450" y="525.5" font-size="13.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">Record the pass in the spine</text><text x="450" y="543.5" font-size="12.5" font-weight="400" fill="#2C2C2A" text-anchor="middle">tools · files written · failing tests</text><polygon points="450,582.0 575.0,614 450,646.0 325.0,614" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/><text x="450" y="618.5" font-size="13.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">goal.is_met()?</text><rect x="310.0" y="670.0" width="280" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/><text x="450" y="693.5" font-size="13.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">Save progress.json</text><text x="450" y="711.5" font-size="12.5" font-weight="400" fill="#2C2C2A" text-anchor="middle">atomic: temp file + os.replace</text><polygon points="450,750.0 575.0,782 450,814.0 325.0,782" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/><text x="450" y="786.5" font-size="13.5" font-weight="600" fill="#712B13" text-anchor="middle">last call &gt; compact_at?</text><rect x="630.0" y="754.0" width="240" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/><text x="750" y="777.5" font-size="13.5" font-weight="600" fill="#712B13" text-anchor="middle">COMPACTED</text><text x="750" y="795.5" font-size="12.5" font-weight="400" fill="#712B13" text-anchor="middle">messages = task + briefing</text><polygon points="450,834.0 575.0,866 450,898.0 325.0,866" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/><text x="450" y="870.5" font-size="13.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">--stop-after reached?</text><polygon points="450,918.0 575.0,950 450,982.0 325.0,950" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/><text x="450" y="954.5" font-size="13.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">passes &lt; 8 (all runs)?</text><rect x="640.0" y="157.0" width="220" height="74" rx="37.0" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.2"/><text x="750" y="180.5" font-size="13.5" font-weight="600" fill="#791F1F" text-anchor="middle">Already finished:</text><text x="750" y="198.5" font-size="12.5" font-weight="400" fill="#791F1F" text-anchor="middle">done → ALREADY DONE</text><text x="750" y="216.5" font-size="12.5" font-weight="400" fill="#791F1F" text-anchor="middle">stopped → refused</text><rect x="640.0" y="334.0" width="220" height="56" rx="28.0" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="750" y="357.5" font-size="13.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">Model stopped</text><text x="750" y="375.5" font-size="12.5" font-weight="400" fill="#2C2C2A" text-anchor="middle">spine: done / stopped</text><rect x="640.0" y="586.0" width="220" height="56" rx="28.0" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/><text x="750" y="609.5" font-size="13.5" font-weight="600" fill="#27500A" text-anchor="middle">DONE</text><text x="750" y="627.5" font-size="12.5" font-weight="400" fill="#27500A" text-anchor="middle">spine status = done</text><rect x="640.0" y="838.0" width="220" height="56" rx="28.0" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.2"/><text x="750" y="861.5" font-size="13.5" font-weight="600" fill="#791F1F" text-anchor="middle">SIMULATED CRASH</text><text x="750" y="879.5" font-size="12.5" font-weight="400" fill="#791F1F" text-anchor="middle">spine stays running</text><rect x="640.0" y="922.0" width="220" height="56" rx="28.0" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.2"/><text x="750" y="945.5" font-size="13.5" font-weight="600" fill="#791F1F" text-anchor="middle">CAP HIT</text><text x="750" y="963.5" font-size="12.5" font-weight="400" fill="#791F1F" text-anchor="middle">spine status = stopped</text><path d="M450,132.0 L450,166.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><path d="M620.0,194 L640.0,194" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><path d="M450,222.0 L450,250.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="458.0" y="232.0" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="start">fresh or resume</text><path d="M450,306.0 L450,330.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><path d="M450,394.0 L450,424.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="458.0" y="405.0" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="start">yes</text><path d="M575.0,362 L640.0,362" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="583.0" y="354" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="start">no</text><path d="M450,468.0 L450,502.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><path d="M450,558.0 L450,582.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><path d="M575.0,614 L640.0,614" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="583.0" y="606" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="start">True</text><path d="M450,646.0 L450,670.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="458.0" y="654.0" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="start">False / None</text><path d="M575.0,866 L640.0,866" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="583.0" y="858" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="start">yes</text><path d="M450,898.0 L450,918.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="458.0" y="904.0" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="start">no</text><path d="M575.0,950 L640.0,950" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="583.0" y="942" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="start">no</text><path d="M325.0,950 L290,950 L290,278 L325.0,278" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="282" y="614.0" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="end">yes</text><path d="M450,726.0 L450,750.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><path d="M575.0,782 L630.0,782" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="583.0" y="774" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="start">yes</text><path d="M750,810.0 L750,828.0 L456,828.0" fill="none" stroke="#D85A30" stroke-width="1.4" marker-end="url(#a)"/><path d="M450,814.0 L450,834.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="442" y="827.0" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="end">no</text>
<rect x="30" y="1054" width="840" height="120" rx="10" fill="#F1EFE8" stroke="#B4B2A9"/><text x="48" y="1078" font-size="13" fill="#2C2C2A" font-weight="600">Result: all 3 runs fixed the 4 bugs. Compaction cut input tokens but raised the bill.</text><text x="48" y="1098" font-size="13" fill="#2C2C2A" font-weight="400">A, limit 5,000: never fired (the run ended first) · 3 passes · 9,157 in / 2,252 out · $0.041</text><text x="48" y="1118" font-size="13" fill="#2C2C2A" font-weight="400">B, --no-compact: baseline · 3 passes · 9,418 in / 2,264 out · $0.042</text><text x="48" y="1138" font-size="13" fill="#2C2C2A" font-weight="400">C, limit 2,000: fired after the file read, then a re-read pass · 4 passes · 8,876 in / 2,562 out · $0.043</text><text x="48" y="1158" font-size="13" fill="#2C2C2A" font-weight="400">Lesson: forgetting right after learning forces a re-read; output costs 5x input; a size check lags one call.</text>
</svg>