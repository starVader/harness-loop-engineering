<svg xmlns="http://www.w3.org/2000/svg" width="900" height="858" viewBox="0 0 900 858" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Stage 2: who decides &quot;done&quot;?</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="900" height="858" fill="#FFFFFF"/>
<text x="30" y="40" font-size="21" font-weight="600" fill="#2C2C2A">Stage 2: who decides &quot;done&quot;?</text>
<text x="30" y="64" font-size="13.5" fill="#5F5E5A">The same loop with a pluggable goal. A goal code can&#x27;t check returns None.</text>
<rect x="600" y="54" width="16" height="12" rx="3" fill="#FAECE7" stroke="#D85A30"/><text x="622" y="64" font-size="12" fill="#5F5E5A">new in this stage</text>
<rect x="300.0" y="82.0" width="300" height="56" rx="28.0" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/><text x="450" y="105.5" font-size="13.5" font-weight="600" fill="#712B13" text-anchor="middle">Start: --goal pytest | self</text><text x="450" y="123.5" font-size="12.5" font-weight="400" fill="#712B13" text-anchor="middle">task = template(goal.description)</text><rect x="325.0" y="172.0" width="250" height="44" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/><text x="450" y="198.5" font-size="13.5" font-weight="600" fill="#3C3489" text-anchor="middle">Act: call the model</text><polygon points="450,246.0 575.0,278 450,310.0 325.0,278" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/><text x="450" y="282.5" font-size="13.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">stop_reason == tool_use?</text><rect x="325.0" y="340.0" width="250" height="44" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/><text x="450" y="366.5" font-size="13.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">Observe: run every tool</text><polygon points="450,414.0 575.0,446 450,478.0 325.0,446" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/><text x="450" y="450.5" font-size="13.5" font-weight="600" fill="#712B13" text-anchor="middle">goal.is_met()?</text><polygon points="450,498.0 575.0,530 450,562.0 325.0,530" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/><text x="450" y="534.5" font-size="13.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">pass &lt; 8?</text><rect x="310.0" y="586.0" width="280" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/><text x="450" y="609.5" font-size="13.5" font-weight="600" fill="#712B13" text-anchor="middle">Every exit → observer</text><text x="450" y="627.5" font-size="12.5" font-weight="400" fill="#712B13" text-anchor="middle">runs the tests once more</text><rect x="615.0" y="241.0" width="270" height="74" rx="37.0" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/><text x="750" y="264.5" font-size="13.5" font-weight="600" fill="#712B13" text-anchor="middle">Model claims done:</text><text x="750" y="282.5" font-size="12.5" font-weight="400" fill="#712B13" text-anchor="middle">None → ACCEPTED ON ITS WORD</text><text x="750" y="300.5" font-size="12.5" font-weight="400" fill="#712B13" text-anchor="middle">True → DONE · False → EARLY</text><rect x="625.0" y="418.0" width="250" height="56" rx="28.0" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/><text x="750" y="441.5" font-size="13.5" font-weight="600" fill="#27500A" text-anchor="middle">True → DONE</text><text x="750" y="459.5" font-size="12.5" font-weight="400" fill="#27500A" text-anchor="middle">verified by code</text><rect x="625.0" y="508.0" width="250" height="44" rx="22.0" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.2"/><text x="750" y="534.5" font-size="13.5" font-weight="600" fill="#791F1F" text-anchor="middle">CAP HIT</text><path d="M450,138.0 L450,172.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><path d="M450,216.0 L450,246.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><path d="M450,310.0 L450,340.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="458.0" y="321.0" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="start">yes</text><path d="M575.0,278 L615.0,278" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="583.0" y="270" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="start">no</text><path d="M450,384.0 L450,414.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><path d="M575.0,446 L625.0,446" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="583.0" y="438" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="start">True</text><path d="M450,478.0 L450,498.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="458.0" y="484.0" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="start">False, or None (can&#x27;t check)</text><path d="M575.0,530 L625.0,530" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="583.0" y="522" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="start">no</text><path d="M325.0,530 L290,530 L290,194 L325.0,194" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="282" y="362.0" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="end">yes</text>
<rect x="30" y="718" width="840" height="100" rx="10" fill="#F1EFE8" stroke="#B4B2A9"/><text x="48" y="742" font-size="13" fill="#2C2C2A" font-weight="600">Result: both goals fixed all 4 bugs (14 passed): the system prompt carried the real goal.</text><text x="48" y="762" font-size="13" fill="#2C2C2A" font-weight="400">self:   5 passes · 25,306 in / 2,848 out · ended ACCEPTED ON THE MODEL&#x27;S WORD (right, but unverifiable)</text><text x="48" y="782" font-size="13" fill="#2C2C2A" font-weight="400">pytest: 4 passes · 15,627 in / 2,156 out · ended DONE: goal verified on pass 4</text><text x="48" y="802" font-size="13" fill="#2C2C2A" font-weight="400">Lesson: is_met() returning None means code must trust the model; it cost 62% more input.</text>
</svg>