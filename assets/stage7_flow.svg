<svg xmlns="http://www.w3.org/2000/svg" width="900" height="710" viewBox="0 0 900 710" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Stage 7: the human gate</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="900" height="710" fill="#FFFFFF"/>
<text x="30" y="40" font-size="21" font-weight="600" fill="#2C2C2A">Stage 7: the human gate</text>
<text x="30" y="64" font-size="13.5" fill="#5F5E5A">Tests say it works, the checker says it&#x27;s allowed, the gate says someone understands it.</text>
<rect x="600" y="54" width="16" height="12" rx="3" fill="#FAECE7" stroke="#D85A30"/><text x="622" y="64" font-size="12" fill="#5F5E5A">new in this stage</text>
<rect x="300.0" y="82.0" width="300" height="56" rx="28.0" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="450" y="105.5" font-size="13.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">Tests pass and the checker</text><text x="450" y="123.5" font-size="12.5" font-weight="400" fill="#2C2C2A" text-anchor="middle">says PASS</text><rect x="290.0" y="166.0" width="320" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/><text x="450" y="189.5" font-size="13.5" font-weight="600" fill="#712B13" text-anchor="middle">Split the change into blocks</text><text x="450" y="207.5" font-size="12.5" font-weight="400" fill="#712B13" text-anchor="middle">skip blocks already explained</text><polygon points="450,246.0 590.0,278 450,310.0 310.0,278" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/><text x="450" y="273.5" font-size="13.5" font-weight="600" fill="#712B13" text-anchor="middle">Human: explain each block</text><text x="450" y="291.5" font-size="12.5" font-weight="400" fill="#712B13" text-anchor="middle">in one sentence?</text><rect x="635.0" y="250.0" width="230" height="56" rx="28.0" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/><text x="750" y="273.5" font-size="13.5" font-weight="600" fill="#27500A" text-anchor="middle">All explained → DONE</text><text x="750" y="291.5" font-size="12.5" font-weight="400" fill="#27500A" text-anchor="middle">saved to .harness/fixes.md</text><rect x="50.0" y="241.0" width="200" height="74" rx="37.0" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.2"/><text x="150" y="264.5" font-size="13.5" font-weight="600" fill="#791F1F" text-anchor="middle">No terminal</text><text x="150" y="282.5" font-size="12.5" font-weight="400" fill="#791F1F" text-anchor="middle">→ NOT accepted</text><text x="150" y="300.5" font-size="12.5" font-weight="400" fill="#791F1F" text-anchor="middle">(fail closed)</text><rect x="290.0" y="334.0" width="320" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/><text x="450" y="357.5" font-size="13.5" font-weight="600" fill="#712B13" text-anchor="middle">reject: &lt;why&gt; → the reasons</text><text x="450" y="375.5" font-size="12.5" font-weight="400" fill="#712B13" text-anchor="middle">go back to the actor</text><rect x="270.0" y="418.0" width="360" height="56" rx="28.0" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/><text x="450" y="441.5" font-size="13.5" font-weight="600" fill="#3C3489" text-anchor="middle">Next pass: the actor reworks</text><text x="450" y="459.5" font-size="12.5" font-weight="400" fill="#3C3489" text-anchor="middle">↻ tests → checker → gate (new blocks only)</text><path d="M450,138.0 L450,166.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><path d="M450,222.0 L450,246.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><path d="M590.0,278 L635.0,278" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="598.0" y="270" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="start">explained</text><path d="M310.0,278 L250.0,278" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="302.0" y="270" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="end">no human</text><path d="M450,310.0 L450,334.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="458.0" y="318.0" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="start">reject</text><path d="M450,390.0 L450,418.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="30" y="550" width="840" height="120" rx="10" fill="#F1EFE8" stroke="#B4B2A9"/><text x="48" y="574" font-size="13" fill="#2C2C2A" font-weight="600">Design: cheapest check first. Tests take milliseconds, the checker cents, a human minutes.</text><text x="48" y="594" font-size="13" fill="#2C2C2A" font-weight="400">Each explanation is keyed to a hash of the lines it explains: edit them and it goes stale (gate --check).</text><text x="48" y="614" font-size="13" fill="#2C2C2A" font-weight="400">The loosened cheat: the honest blocks keep their explanations; only the block that deletes</text><text x="48" y="634" font-size="13" fill="#2C2C2A" font-weight="400">the expiry check asks for a sentence, and an honest sentence has to admit the deletion.</text><text x="48" y="654" font-size="13" fill="#2C2C2A" font-weight="400">Checked offline in selftest/ (fake model, scripted human).</text>
</svg>